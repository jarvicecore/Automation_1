[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "reposentry"
version = "0.1.0"
description = "In-repo pre-merge secret-leak and hygiene scanner, run as part of the security gate."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "secure-release-pipeline maintainers" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
reposentry = "reposentry.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.11",
    "bandit>=1.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/reposentry"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=reposentry --cov-report=term-missing --cov-report=xml"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
