# Illustrative environment-gated deployment pipeline.
#
# This repo has no real deployment target — the steps below are placeholders
# marked clearly as such. What's real and meant to be copied is the
# structure: OIDC federation instead of stored cloud credentials, a GitHub
# Environment carrying the approval gate, a concurrency group that protects
# in-flight deploys instead of cancelling them, and a failure notification
# hook.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        required: true
        options:
          - staging
          - production

# Unlike CI, a live deploy must never be cancelled mid-flight by a newer
# trigger — queue behind it instead.
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    # Maps to a GitHub Environment (Settings > Environments). In an org
    # account this is where required reviewers, wait timers, and
    # environment-scoped secrets/variables actually live.
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write # enables OIDC federation — no long-lived cloud access key stored as a secret
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Assume deployment role via OIDC
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy application (placeholder)
        run: |
          echo "::notice::This step is a template placeholder — replace with the real deploy command"
          echo "e.g. aws ecs update-service --cluster ... --service ... --force-new-deployment"
          echo "e.g. aws s3 sync ./dist s3://\${{ vars.DEPLOY_BUCKET }} --delete"

      - name: Post-deploy smoke test (placeholder)
        run: |
          echo "::notice::This step is a template placeholder — replace with a real health-check call"
          echo "e.g. curl --fail https://\${{ inputs.environment }}.example.com/healthz"

      - name: Write deployment summary
        if: always()
        run: |
          {
            echo "### Deployment — ${{ inputs.environment }}"
            echo "- Triggered by: ${{ github.actor }}"
            echo "- Ref: ${{ github.sha }}"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify on failure
        if: failure()
        uses: slackapi/slack-github-action@485a9d42d3a73031f12ec201c457e2162c45d02d # v2.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ vars.SLACK_DEPLOY_CHANNEL }}
            text: ":rotating_light: Deploy to ${{ inputs.environment }} failed — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
