
# Reusable security gate.
#
# Combines GitHub-native scanning (CodeQL, dependency review, Scorecard) with
# commercial scanners (Snyk, SonarQube). Every scanner that emits SARIF uploads
# to GitHub code scanning, so findings from all tools land in one Security tab
# and can be enforced with a single branch-protection check.
#
# Snyk and SonarQube are flag-gated on repository VARIABLES so the pipeline is
# green from day one and turns hard-blocking the moment you supply licenses:
#   vars.ENABLE_SNYK  = 'true'   + secrets.SNYK_TOKEN
#   vars.ENABLE_SONAR = 'true'   + secrets.SONAR_TOKEN, vars.SONAR_HOST_URL

name: _security

on:
  workflow_call:
    inputs:
      runner:
        required: false
        type: string
        default: ubuntu-latest
      dependency-review:
        description: Run dependency review. Only meaningful on pull_request events.
        required: false
        type: boolean
        default: false
      fail-on-severity:
        description: Severity at which a third-party finding fails the build.
        required: false
        type: string
        default: high

jobs:
  # ---------------------------------------------------------------- GitHub native
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60

    permissions:
      contents: read
      security-events: write
      packages: read

    strategy:
      fail-fast: false
      matrix:
        # Override with repo variable CODEQL_LANGUAGES, e.g. "actions,python".
        # `actions` scans the workflow files in this repo for CI/CD vulnerabilities
        # -- worth keeping enabled permanently regardless of app language.
        language: ${{ fromJSON(vars.CODEQL_LANGUAGES_JSON || '["actions"]') }}

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@3599b3baa15b485a2e49ef411a7a4bb2452e7f93 # v3.30.5
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@3599b3baa15b485a2e49ef411a7a4bb2452e7f93 # v3.30.5

      - name: Analyze
        uses: github/codeql-action/analyze@3599b3baa15b485a2e49ef411a7a4bb2452e7f93 # v3.30.5
        with:
          category: /language:${{ matrix.language }}

  dependency-review:
    name: Dependency review
    if: inputs.dependency-review
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      # Blocks a PR that introduces a vulnerable dependency or a disallowed licence,
      # before it ever reaches main.
      - name: Review dependencies
        uses: actions/dependency-review-action@3c4e3dcb1aa7874d2c16be7d79418e9b7efd6261 # v4.8.2
        with:
          fail-on-severity: ${{ inputs.fail-on-severity }}
          comment-summary-in-pr: on-failure
          deny-licenses: AGPL-1.0-or-later, AGPL-3.0-or-later, GPL-2.0-or-later, GPL-3.0-or-later

  # ---------------------------------------------------------------- Commercial
  snyk:
    name: Snyk
    if: vars.ENABLE_SNYK == 'true'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22

      # Installed from npm rather than via snyk/actions so there is one less
      # third-party action with access to the job.
      - name: Install Snyk CLI
        run: npm install --global --no-fund --no-audit snyk@1.1300.0

      - name: Snyk Open Source (SCA)
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --all-projects --severity-threshold=${{ inputs.fail-on-severity }} --sarif-file-output=snyk-sca.sarif

      - name: Snyk Code (SAST)
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk code test --severity-threshold=${{ inputs.fail-on-severity }} --sarif-file-output=snyk-code.sarif

      # Uploading is what makes findings enforceable. The scan steps above are
      # continue-on-error purely so that a scanner outage cannot wedge the pipeline;
      # the resulting alerts still block merges via the code-scanning ruleset.
      - name: Upload Snyk SARIF
        uses: github/codeql-action/upload-sarif@3599b3baa15b485a2e49ef411a7a4bb2452e7f93 # v3.30.5
        with:
          sarif_file: .
          category: snyk

  sonarqube:
    name: SonarQube
    if: vars.ENABLE_SONAR == 'true'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # Sonar needs full history to attribute issues to new code.
          fetch-depth: 0
          persist-credentials: false

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      # Hard gate: fails the job if the Sonar quality gate fails.
      - name: Enforce quality gate
        uses: SonarSource/sonarqube-scan-action/sonarqube-quality-gate@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

  # A single check to put in branch protection. Required checks are brittle when
  # they point at matrixed / conditional jobs, because a skipped job never reports.
  # This aggregator always reports, and fails if any gate genuinely failed.
  gate:
    name: Security gate
    if: always()
    needs: [codeql, dependency-review, snyk, sonarqube]
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Evaluate results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Upstream results: ${RESULTS}"
          for r in ${RESULTS}; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::Security gate failed (a scanner reported '${r}')."
              exit 1
            fi
          done
          echo "Security gate passed."
