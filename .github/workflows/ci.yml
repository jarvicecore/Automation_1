# Primary CI pipeline: lint/type/test across a version matrix, then a build
# job that only runs once the matrix is green. Fans out via a reusable
# workflow (reusable-python-tests.yml) so the check sequence is defined once.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. a PR pushed twice in a row)
# so we don't burn runner minutes on commits nobody will look at.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default to no permissions; each job opts in to only what it needs.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    uses: ./.github/workflows/reusable-python-tests.yml
    with:
      python-version: ${{ matrix.python-version }}

  build:
    name: build package
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.12"

      - name: Build sdist & wheel
        run: |
          pip install build
          python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: dist
          path: dist/
          retention-days: 14
