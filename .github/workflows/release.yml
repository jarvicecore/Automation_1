# Tag-triggered release: build once, publish to PyPI via OIDC "trusted
# publishing" (no long-lived API token stored as a secret), then cut a
# GitHub release from the same artifacts. Each stage only gets the
# permissions it needs.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up environment
        uses: ./.github/actions/setup-python-env

      - name: Run full verification before publishing
        run: |
          ruff check src tests
          ruff format --check src tests
          mypy
          pytest

      - name: Build sdist & wheel
        run: |
          pip install build
          python -m build

      - name: Generate SBOM
        uses: anchore/sbom-action@df80a981bc6edbc4e220a492d3cbe9f5547a6e75 # v0.17.9
        with:
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Upload release artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: release-artifacts
          path: |
            dist/
            sbom.cyclonedx.json
          retention-days: 90

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # A GitHub Environment lets an org attach required reviewers / wait
    # timers to production publishes without touching this workflow file.
    environment:
      name: pypi
      url: https://pypi.org/project/reposentry/
    permissions:
      id-token: write # OIDC token for PyPI trusted publishing — no API token secret to leak or rotate
      contents: read
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: release-artifacts
          path: .

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ecb4c3dfd4790f14e30aaeac04855c7413ee9368 # v1.12.2
        with:
          packages-dir: dist/

  github-release:
    name: Create GitHub release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create a release
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: release-artifacts
          path: .

      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/* sbom.cyclonedx.json \
            --repo "${{ github.repository }}" \
            --generate-notes
