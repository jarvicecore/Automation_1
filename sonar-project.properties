# SonarQube project configuration.
# Consumed by SonarSource/sonarqube-scan-action in .github/workflows/_security.yml.
# The scan only runs when vars.ENABLE_SONAR == 'true'.

sonar.projectKey=jarvicecore_Automation_1
sonar.projectName=Automation_1
sonar.organization=jarvicecore

sonar.sources=src,scripts
sonar.exclusions=**/dist/**,**/build/**,**/*.tar.gz

sonar.tests=tests
sonar.test.inclusions=**/test_*.py,**/*_test.py,**/*.test.*

# The quality gate is what actually blocks a merge. "New code" scoping means a
# legacy debt pile does not permanently red-light every PR, while still holding
# the line on anything written from now on.
sonar.qualitygate.wait=true
sonar.newCode.referenceBranch=main
